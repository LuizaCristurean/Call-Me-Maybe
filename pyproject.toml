[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool that turns natural-language prompts into structured function calls, using constrained decoding on a local LLM (42 project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "llm-sdk",
]

# llm_sdk isn't on PyPI -- it's the package 42 handed us, sitting in ./llm_sdk.
# This tells uv "when something depends on llm-sdk, resolve it from this local
# folder", installed in editable mode so we don't have to reinstall if it ever changes.
[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

# We're not building/publishing "call-me-maybe" as an installable library --
# it's just a runnable app (src/ + a Makefile). package = false tells uv not
# to try to build and install our own project as a wheel; it only needs to
# resolve and install the *dependencies* above into .venv/.
[tool.uv]
package = false

[dependency-groups]
dev = ["flake8>=7.0", "mypy>=1.10"]
